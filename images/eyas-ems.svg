  <text x="400" y="75" fill="#c084fc" font-family="'Cairo', Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">لوحة تحكم مركز ميديا لإدارة الموظفين والمهام (EMS)</text>
  <text x="400" y="105" fill="#94a3b8" font-family="'Cairo', Arial, sans-serif" font-size="13" text-anchor="middle">تتبع الحضور والانصراف، توزيع المهام، ومخطط علاقات قواعد البيانات (ERD)</text>
  <g transform="translate(100, 140)">
